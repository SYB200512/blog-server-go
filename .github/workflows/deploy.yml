# blog-server-go：构建 + 部署 Go 后端到云服务器
# 触发：push 到 main，或手动 Run workflow
# 需要的 Secrets：SERVER_HOST / SERVER_USER(ubuntu) / SERVER_SSH_KEY

name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'          # 与 go.mod 一致

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: 交叉编译 Linux 二进制
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o blog-backend .

      - name: 上传二进制到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "blog-backend"
          target: "/opt/blog/backend/releases"

      - name: 备份旧版本并重启后端
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cp /opt/blog/backend/blog-backend /opt/blog/backend/blog-backend.bak 2>/dev/null || true
            install -m 0755 /opt/blog/backend/releases/blog-backend /opt/blog/backend/blog-backend
            /opt/blog/backend/start.sh
            sleep 2
            pgrep -f blog-backend && echo "backend restarted OK"

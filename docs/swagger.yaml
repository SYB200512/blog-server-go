      security:
      - BearerAuth: []
      summary: 审核评论
      tags:
      - 后台-评论
  /api/v1/admin/tags:
    post:
      consumes:
      - application/json
      operationId: admin_tag_create
      parameters:
      - description: 标签信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.TagCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/database.Tag'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建标签
      tags:
      - 后台-标签
  /api/v1/admin/tags/{id}:
    delete:
      operationId: admin_tag_delete
      parameters:
      - description: 标签ID
        in: path
        name: id
        required: true

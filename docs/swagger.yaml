  /api/v1/archive:
    get:
      operationId: article_archive
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    items:
                      $ref: '#/definitions/database.Article'
                    type: array
                  type: object
              type: object
      summary: 按时间归档
      tags:
      - 前台-文章
  /api/v1/articles:
    get:
      operationId: article_list
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 标题/摘要关键词
        in: query
        name: keyword
        type: string
      - description: 分类ID

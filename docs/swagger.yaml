      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/database.Category'
                  type: array
              type: object
      summary: 分类列表
      tags:
      - 前台-分类
  /api/v1/covers/{filename}:
    get:
      operationId: covers_get
      parameters:
      - description: 封面文件名
        in: path
        name: filename
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: 图片文件
          schema:
            type: file
        "404":
          description: 文件不存在
          schema:
            $ref: '#/definitions/response.Response'
      summary: 封面图片
      tags:
      - 前台-资源
  /api/v1/tags:
    get:
      operationId: tag_list
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/database.Tag'
                  type: array
              type: object
      summary: 标签列表
      tags:
      - 前台-标签
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

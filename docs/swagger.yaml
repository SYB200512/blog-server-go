                        type: array
                    type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 前台文章列表
      tags:
      - 前台-文章
  /api/v1/articles/{id}:
    get:
      operationId: article_get
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/database.Article'
              type: object
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.Response'
      summary: 前台文章详情
      tags:
      - 前台-文章
  /api/v1/articles/{id}/comments:

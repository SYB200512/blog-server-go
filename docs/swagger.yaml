basePath: /api/v1
definitions:
  database.Article:
    properties:
      category:
        allOf:
        - $ref: '#/definitions/database.Category'
        description: 关联（查询时填充）
      category_id:
        type: integer
      comment_num:
        type: integer
      content:
        type: string
      cover:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_top:
        description: 0 否，1 是
        type: integer
      like_count:
        type: integer
      status:
        description: 0 草稿，1 已发布
        type: integer
      summary:
        type: string
      tags:
        items:
          $ref: '#/definitions/database.Tag'
        type: array
      title:
        type: string
      updated_at:
        type: string
      views:
        type: integer
    type: object
  database.Category:
    properties:
      article_count:
        description: 非表字段：文章数量（查询时填充），只读
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  database.Comment:
    properties:
      article_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      parent_id:
        description: 0 = 顶层评论
        type: integer
      status:
        description: 0 待审核，1 已通过
        type: integer
      user:
        allOf:
        - $ref: '#/definitions/database.User'
        description: 关联（查询时填充）
      user_id:
        type: integer
    type: object
  database.Tag:
    properties:
      article_count:
        description: 非表字段：文章数量（查询时填充），只读
        type: integer
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  database.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      role:
        description: 0 普通，1 管理员
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  request.ArticleCreateRequest:
    properties:
      category_id:
        type: integer
      content:
        type: string
      cover:
        type: string
      is_top:
        type: integer
      status:
        description: 0 草稿，1 发布
        type: integer
      summary:
        type: string
      tag_ids:
        items:
          type: integer
        type: array
      title:
        type: string
    required:
    - title
    type: object
  request.ArticleUpdateRequest:
    properties:
      category_id:
        type: integer
      content:
        type: string
      cover:
        type: string
      is_top:
        type: integer
      status:
        type: integer
      summary:
        type: string
      tag_ids:
        items:
          type: integer
        type: array
      title:
        type: string
    type: object
  request.CategoryCreateRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  request.CategoryUpdateRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  request.CommentCreateRequest:
    properties:
      content:
        type: string
      email:
        type: string
      parent_id:
        type: integer
    required:
    - content
    type: object
  request.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  request.ReviewCommentRequest:
    properties:
      status:
        description: 0 待审核，1 已通过
        type: integer
    type: object
  request.TagCreateRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  response.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/response.UserInfo'
    type: object
  response.PageResult:
    properties:
      list: {}
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  response.UserInfo:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      role:
        type: integer
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 个人博客系统的后端 HTTP API
  title: 博客系统 API
  version: "1.0"
paths:
  /api/v1/admin/articles:
    get:
      operationId: admin_article_list
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 标题/摘要关键词
        in: query
        name: keyword
        type: string
      - description: 分类ID
        in: query
        name: category_id
        type: integer
      - description: 标签ID
        in: query
        name: tag_id
        type: integer
      - description: '状态: 0 草稿, 1 已发布'
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageResult'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/database.Article'
                        type: array
                    type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 后台文章列表
      tags:
      - 后台-文章
    post:
      consumes:
      - application/json
      operationId: admin_article_create
      parameters:
      - description: 文章信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.ArticleCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/database.Article'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - 后台-文章
  /api/v1/admin/articles/{id}:
    delete:
      operationId: admin_article_delete
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除文章
      tags:
      - 后台-文章
    get:
      operationId: admin_article_get
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/database.Article'
              type: object
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 后台文章详情
      tags:
      - 后台-文章
    put:
      consumes:
      - application/json
      operationId: admin_article_update
      parameters:
      - description: 文章ID
        in: path
        name: id
        required: true
        type: integer
      - description: 文章信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.ArticleUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/database.Article'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新文章
      tags:
      - 后台-文章
  /api/v1/admin/categories:
    post:
      consumes:
      - application/json
      operationId: admin_category_create
      parameters:
      - description: 分类信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.CategoryCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/database.Category'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建分类
      tags:
      - 后台-分类
  /api/v1/admin/categories/{id}:
    delete:
      operationId: admin_category_delete
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除分类
      tags:
      - 后台-分类
    put:
      consumes:
      - application/json
      operationId: admin_category_update
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: integer
      - description: 分类信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.CategoryUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/database.Category'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新分类
      tags:
      - 后台-分类
  /api/v1/admin/comments:
    get:
      operationId: admin_comment_list
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: '状态: 0 待审核, 1 已通过'
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageResult'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/database.Comment'
                        type: array
                    type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 后台评论列表
      tags:
      - 后台-评论
  /api/v1/admin/comments/{id}:
    put:
      consumes:
      - application/json
      operationId: admin_comment_review
      parameters:
      - description: 评论ID
        in: path
        name: id
        required: true
        type: integer
      - description: 审核信息
        in: body
        name: body
        required: true

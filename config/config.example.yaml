# 博客后端配置——示例模板（提交进仓库，供参考结构与所需环境变量）
# 复制为 config/config.yaml 使用：cp config.example.yaml config.yaml
# ⚠️ 敏感值一律不要写进任何入库文件，统一用环境变量注入（优先级：环境变量 > yaml）：
#   DB_HOST / DB_PORT / DB_USER / DB_NAME / DB_PASSWORD
#   REDIS_ADDR / REDIS_PASSWORD / REDIS_DB
#   CONFIG_PATH（配置文件路径，容器内工作目录不固定时使用）/ SERVER_PORT
#   JWT_SECRET
#   DASHSCOPE_API_KEY / DASHSCOPE_BASE / COVERS_DIR / COVER_ENABLED
#   STORAGE_TYPE / COS_SECRET_ID / COS_SECRET_KEY / COS_BUCKET / COS_REGION / COS_DOMAIN / COS_PREFIX
server:
  port: 8080
  mode: debug # debug / release
  request_timeout: 10 # 单请求处理预算（秒）
  shutdown_timeout: 15 # 优雅停机等待时间（秒）
  # P0：HTTP Server 超时与请求头上限
  read_timeout: 60 # 含 body，必须覆盖上传的 60 秒预算
  write_timeout: 60 # 响应写出上限
  idle_timeout: 75 # keep-alive 空闲回收
  max_header_bytes: 1048576 # 1 MB
  pprof_addr: "127.0.0.1:6060" # 只监听本机；填 "off" 关闭

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""            # ← 用环境变量 DB_PASSWORD 注入
  dbname: blog
  charset: utf8mb4
  max_open_conns: 100
  max_idle_conns: 10
  # P0：连接池生命周期
  conn_max_lifetime: 30 # 分钟，需小于 MySQL wait_timeout
  conn_max_idle_time: 10 # 分钟

jwt:
  secret: ""              # ← 用环境变量 JWT_SECRET 注入
  expire_hours: 24

# Redis 缓存：硬依赖必须配置 addr；但运行期故障不致命，缓存层会降级直连数据库，
# Redis 恢复后自动生效（go-redis 自动重连 + 熔断半开探测）
redis:
  addr: 127.0.0.1:6379    # ← 环境变量 REDIS_ADDR
  password: ""            # ← 环境变量 REDIS_PASSWORD，不写明文进仓库
  db: 1                   # ← 环境变量 REDIS_DB，逻辑库索引，与其他应用隔离
  pool_size: 10
  dial_timeout: 2         # 秒，连接建立上限
  read_timeout: 300       # 毫秒，单次读上限：缓存慢不允许拖长请求
  write_timeout: 300      # 毫秒，单次写上限
  key_prefix: blog        # key 前缀，所有 key 形如 blog:v1:...

ai:
  cover:
    enabled: true           # 开启后发文将异步生成封面；设 false 关闭（无需配置 api_key）
    api_key: ""             # ← 用环境变量 DASHSCOPE_API_KEY 注入；enabled=true 时必填，否则启动失败
    base_url: "https://dashscope.aliyuncs.com"
    covers_dir: "./covers"  # 本地存储时封面/图片落盘目录，cos 模式不使用
    cover_timeout: 90       # 异步生成封面超时（秒）

# 图片存储：local 存本地 covers 目录，cos 存腾讯云对象存储
storage:
  type: local             # local / cos
  max_size: 5             # 单张图片大小上限（MB）
  cos:
    secret_id: ""         # ← 环境变量 COS_SECRET_ID
    secret_key: ""        # ← 环境变量 COS_SECRET_KEY
    bucket: ""            # ← 环境变量 COS_BUCKET，如 glog-picture-1476699112
    region: ""            # ← 环境变量 COS_REGION，如 ap-guangzhou
    domain: ""            # ← 环境变量 COS_DOMAIN，自定义域名，留空用默认域名
    prefix: "blog"        # ← 环境变量 COS_PREFIX，对象键前缀

log:
  level: info # debug / info / warn / error（生产用 info，避免 debug 日志刷屏）
  director: logs # 日志输出目录（.gitignore 已忽略 /logs/）
  max_size: 2 # 单个日志文件大小上限（MB），超过自动切割
  max_backups: 3 # 保留的旧日志文件数量
  max_age: 7 # 日志文件最长保留天数